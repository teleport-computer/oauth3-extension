<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
/* === tokens.css (inlined — extension pages can't fetch external css) ========= */
:root {
  --ink1: #00838a;   /* teal — structure, primary actions, ok-status */
  --ink2: #ff48b0;   /* fluoro pink — emphasis, danger, stamps, wedges */
  --paper: #f8f7f3;
  --deep: #123f43;        /* ink1 pulled toward black: body text + dark blocks */
  --overprint: #00255f;   /* ink1 × ink2 multiply — free third color, decorative only */

  --bg: var(--paper);
  --text: var(--deep);
  --faint: color-mix(in srgb, var(--deep) 55%, var(--paper));
  --rule: color-mix(in srgb, var(--deep) 16%, var(--paper));
  --card: #fff;
  --block: var(--deep);       /* enclave/evidence blocks */
  --block-text: #f8f7f3;
  --wash1: color-mix(in srgb, var(--ink1) 15%, var(--paper));
  --wash2: color-mix(in srgb, var(--ink2) 17%, var(--paper));
  --i1-text: #00676d;   /* inks deepened for small text on washes */
  --i2-text: #c2187a;
  --warn: #a8780c;      /* marigold — the ONLY third ink, stale/warn states only */
  --warn-wash: color-mix(in srgb, #e0a41a 22%, var(--paper));

  --sans: "Helvetica Neue", Arial, sans-serif;                /* UI body */
  --cond: "Arial Narrow", "Helvetica Neue", sans-serif;       /* display: 800 uppercase */
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;     /* anything verifiable */

  --off: 1px;   /* misregistration offset — NEVER larger, display text ≥19px only */
}
@media (prefers-color-scheme: dark) { :root {
  --ink1: #2fbdc4; --ink2: #ff5fbb;
  --paper: #0e1f21; --deep: #081517;
  --bg: #0e1f21; --text: #e9f0ee;
  --faint: color-mix(in srgb, #e9f0ee 55%, #0e1f21);
  --rule: color-mix(in srgb, #e9f0ee 14%, #0e1f21);
  --card: #142829; --block: #081517; --block-text: #e9f0ee;
  --wash1: color-mix(in srgb, #2fbdc4 20%, #0e1f21);
  --wash2: color-mix(in srgb, #ff5fbb 20%, #0e1f21);
  --i1-text: #5fd3d9; --i2-text: #ff8ccb;
  --warn: #e0b34a; --warn-wash: color-mix(in srgb, #e0b34a 18%, #0e1f21);
} }

/* === components.css (inlined) ================================================ */
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--i1-text); }
:focus-visible { outline: 2px solid var(--ink2); outline-offset: 2px; }

.wordmark { display: inline-flex; align-items: center; gap: 10px; font: 800 20px var(--sans); letter-spacing: -.01em; color: var(--text); }
.wordmark img { width: 28px; height: 28px; }
.wordmark b { color: var(--i2-text); font-weight: inherit; }

.btn { display: inline-flex; align-items: center; gap: 8px; font: 800 14px var(--cond); text-transform: uppercase; letter-spacing: .12em; border: 0; padding: 12px 22px; cursor: pointer; background: var(--ink1); color: #fff; box-shadow: 3px 3px 0 var(--ink2); }
.btn.ghost { background: transparent; color: var(--i1-text); border: 3px solid var(--ink1); box-shadow: none; }
.btn.danger { background: var(--ink2); color: var(--deep); box-shadow: 3px 3px 0 var(--ink1); }
.btn.quiet { background: transparent; color: var(--text); border: 1px solid var(--rule); box-shadow: none; font: 600 13px var(--sans); letter-spacing: 0; text-transform: none; }
.btn:disabled { cursor: default; opacity: .5; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--mono); padding: 4px 10px; border-radius: 999px; }
.pill.ok   { background: var(--wash1); color: var(--i1-text); }
.pill.warn { background: var(--warn-wash); color: var(--warn); }
.pill.bad  { background: var(--wash2); color: var(--i2-text); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot.ok { background: var(--ink1); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--ink2); }

.note { background: var(--wash1); border-left: 6px solid var(--ink1); padding: 12px 14px; font-size: 14px; }

/* === popup-local layout (style through tokens; no hardcoded hex) ============= */
html { background: var(--bg); }
body { width: 320px; max-width: 100%; margin: 0; padding: 14px; box-sizing: border-box; font-size: 13px; }
.wrap { display: flex; flex-direction: column; gap: 12px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header .wordmark { font-size: 18px; }
header .wordmark img { width: 26px; height: 26px; }
header .meta { font: 500 10px/1.2 var(--mono); letter-spacing: .14em; text-transform: lowercase; color: var(--faint); text-align: right; }

#ident { font: 500 11px/1.4 var(--mono); letter-spacing: .03em; color: var(--faint); }

#instance { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--text); }
#instance .dot { width: 9px; height: 9px; flex: 0 0 auto; }
#instText { min-width: 0; }

#jars { display: flex; flex-direction: column; gap: 6px; }
.jar { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: var(--card); border: 1.5px solid var(--rule); cursor: pointer; }
.jar:hover { background: var(--wash1); }
.jar.busy { opacity: .5; }
.jhead { display: flex; align-items: center; justify-content: space-between; }
.jname { font-weight: 700; color: var(--text); }
.jstat { display: flex; flex-wrap: wrap; gap: 4px; }
.jstat .pill { font-size: 11px; padding: 3px 8px; }
/* a bare .pill (no ok/warn/bad) is the neutral pending state — token-derived, not hex */
.pill { background: var(--rule); color: var(--faint); }
.jar .x { border: 0; background: transparent; color: var(--faint); cursor: pointer; font: 600 13px var(--sans); padding: 0 2px; }
.jar .x:hover { color: var(--i2-text); }

#empty { font: 12px/1.5 var(--mono); color: var(--faint); }

.add { display: flex; gap: 6px; align-items: stretch; }
.add select { flex: 1; }

label { display: block; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: lowercase; color: var(--faint); margin: 8px 0 3px; }
input, select { width: 100%; padding: 7px 8px; border: 1.5px solid var(--rule); background: var(--card); color: var(--text); font: 13px var(--sans); box-sizing: border-box; }
input:focus, select:focus { outline: 2px solid var(--ink2); outline-offset: 0; border-color: var(--ink1); }

#syncAll { width: 100%; justify-content: center; }
#syncAll:disabled { box-shadow: none; }
#addBtn { padding: 10px 14px; }
#saveAdv { margin-top: 10px; }

details { margin-top: 4px; }
summary { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: lowercase; color: var(--faint); cursor: pointer; }

#status { margin: 0; font: 13px/1.45 var(--sans); display: none; }
#status.note { display: block; }
#status.bad { background: var(--wash2); border-left-color: var(--ink2); color: var(--i2-text); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="wordmark"><img src="icons/icon-48.png" alt="" /><span>oauth<b>3</b></span></span>
      <span class="meta">credential wallet</span>
    </header>

    <div id="ident">this browser is your identity — no sign-in needed</div>

    <div id="instance"><span class="dot" id="instDot"></span><span id="instText">checking…</span></div>

    <div id="jars"></div>
    <div id="empty" hidden>No jars yet — add a site below to keep it synced into your instance.</div>

    <div class="add">
      <select id="addPlugin"></select>
      <button id="addBtn" class="btn ghost">+ Add jar</button>
    </div>

    <button id="syncAll" class="btn">Sync all now</button>

    <details>
      <summary>Advanced (instance URL, owner secret, federation verify)</summary>
      <label>OAuth3 instance URL</label>
      <input id="serverUrl" placeholder="http://localhost:3000" />
      <label>Owner secret (optional — admin override)</label>
      <input id="secret" type="password" placeholder="OWNER_SECRET" />
      <label>Daemon URL</label>
      <input id="daemon" placeholder="https://daemon.example" />
      <label>Project name</label>
      <input id="project" placeholder="otter-sync" />
      <label>Allowed tree hashes (comma-separated)</label>
      <input id="allow" placeholder="abc123,def456" />
      <button id="saveAdv" class="btn quiet">Save</button>
    </details>

    <div id="status"></div>
  </div>
  <script>
// HARNESS (committed template): renders the UNMODIFIED shipped popup.js (PR #20)
// against the DEPLOYED staging oauth3 node, LIVE — no fetch shim. Staging sends
// `Access-Control-Allow-Origin: *` and allows the `Authorization` header, so a normal
// page CAN read /api/plugins with the wallet Bearer (the real toolbar popup is browser
// chrome that captureVisibleTab cannot grab, so the rig renders popup.js at its shipped
// 320px width instead). chrome.* is stubbed (render-time only); the jars subscription
// list is pre-seeded to twitter+amazon.
//
// The walletSession is REDACTED here — it is a real staging credential and must not be
// committed to a public repo. To reproduce: POST <serverUrl>/api/login {userKey} with
// the u-swarm userKey (~/.paseo-secrets/swarm-userkey), then put the returned `session`
// into __CFG.walletSession and load this page in the rig browser.
const __CFG = {
  serverUrl: "https://78ffc78c25e0c8a9e64bb3a969ba6f226abae62d-8080.dstack-pha-prod7.phala.network/oauth3",
  walletSession: "<redacted — POST /api/login with the u-swarm userKey, see comment above>",
  walletSubject: "u-eaf13541f186c7c5f466dc04e2e5da4b",
  secret: "", daemon: "", project: "", allow: "",
  jars: { twitter: { lastSync: 0 }, amazon: { lastSync: 0 } }
};
window.chrome = {
  storage: { local: { get: async (k) => { const keys = Array.isArray(k)?k:(k?[k]:[]); const o={}; for(const x of keys) if(x in __CFG) o[x]=__CFG[x]; return o; }, set: async()=>{} } },
  runtime: { sendMessage: async()=>({}), onMessage: { addListener(){} }, id: "rig-harness" },
  permissions: { remove: async()=>{}, request: async()=>true }
};
</script>
<script>
// === inlined popup.js (PR #20, verbatim) ===
const $ = (id) => document.getElementById(id);
const status = (msg, ok) => { const s = $("status"); s.textContent = msg; s.className = ok ? "note" : "note bad"; };
// A stale/old service worker won't answer new message types → sendMessage resolves
// undefined. Surface that instead of a cryptic "reading 'ok' of undefined".
async function call(msg) {
  const r = await chrome.runtime.sendMessage(msg);
  if (!r) throw new Error("no reply from service worker — reload the extension at chrome://extensions");
  return r;
}

// Default homeserver (the matrix.org-equivalent) — so the instance URL is NOT
// something you paste. Override only in Advanced if self-hosting.
const DEFAULT_HOMESERVER = "https://915c8197b20b831c52cf97a9fb7e2e104cdc6ae8-8080.dstack-pha-prod7.phala.network/oauth3";

let PLUGINS = [];        // from /api/plugins
let REACHABLE = false;

const node = () => ($("serverUrl").value || DEFAULT_HOMESERVER).replace(/\/$/, "");
const labelFor = (id) => PLUGINS.find((p) => p.id === id)?.label || id;
// chrome.cookies only returns cookies for sites the extension has host access to,
// so a jar needs host permission for its cookie domains. Need both apex and
// wildcard: "*.otter.ai" does NOT match "otter.ai".
const originsFor = (id) => (PLUGINS.find((p) => p.id === id)?.cookieDomains || [])
  .flatMap((d) => { const h = d.replace(/^\./, ""); return [`https://${h}/*`, `https://*.${h}/*`]; });

const ago = (ts) => { if (!ts) return "never"; const s = Math.floor((Date.now() - ts) / 1000);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`; };

const FRESH_MS = 35 * 60 * 1000; // auto-resync is every 30m; past that a jar is stale
// Freshness maps to design-system pill states (ok/warn/bad); "" = neutral pending.
function health(j) {
  if (!j || !j.lastSync) return ["", "syncing…"];
  if (!j.ok) return ["bad", j.error || "sync failed"];
  if (Date.now() - j.lastSync > FRESH_MS) return ["warn", `stale · ${j.count} · ${ago(j.lastSync)}`];
  return ["ok", `${j.count} · ${ago(j.lastSync)}`];
}

// #14: a plugin may now hold several account-qualified jars. The server is the source
// of truth — GET /api/plugins returns jars: [{account, updatedAt, count}] — so render
// one pill per account instead of a single present/absent badge. pill state from the
// jar's updatedAt (auto-resync keeps it fresh); a jar with no updatedAt isn't synced yet.
function jarHealth(j) {
  if (!j || !j.updatedAt) return ["", j?.account ? `${j.account} · pending` : "no jar"];
  const stale = Date.now() - j.updatedAt > FRESH_MS;
  return [stale ? "warn" : "ok", `${j.account} · ${j.count} · ${ago(j.updatedAt)}`];
}

// Federation pin: trust the code measurement, not the operator. If a daemon/project/
// allowlist is configured, check the recorded tree_hash before syncing anything.
async function verifyInstance(daemon, project, allow) {
  try {
    const r = await fetch(`${daemon}/_api/projects/${project}`);
    if (!r.ok) return { ok: false, error: `verify: daemon ${r.status}` };
    const th = (await r.json()).tree_hash || "";
    if (!allow.includes(th)) return { ok: false, error: `untrusted measurement (${th.slice(0, 10) || "none"})` };
    return { ok: true };
  } catch (e) { return { ok: false, error: `verify failed: ${e.message}` }; }
}
async function ensureTrusted() {
  const d = $("daemon").value.replace(/\/$/, ""), p = $("project").value.trim(), a = $("allow").value.trim();
  if (!(d && p && a)) return true;
  const v = await verifyInstance(d, p, a.split(",").map((s) => s.trim()).filter(Boolean));
  if (!v.ok) { status(`instance not trusted — ${v.error}`, false); return false; }
  return true;
}

async function loadPlugins() {
  // #14: jar status is per-identity — the server returns jars: [] for an anonymous
  // caller. Authenticate with the wallet session (cached on first sync) so the
  // subject's account-qualified jars actually come back.
  const { walletSession, secret } = await chrome.storage.local.get(["walletSession", "secret"]);
  const headers = secret ? { Authorization: `Bearer ${secret}` } : walletSession ? { Authorization: `Bearer ${walletSession}` } : {};
  try { PLUGINS = (await (await fetch(`${node()}/api/plugins`, { headers })).json()).plugins; REACHABLE = true; }
  catch { PLUGINS = []; REACHABLE = false; }
}

async function render() {
  const { jars = {} } = await chrome.storage.local.get("jars");
  let host = ""; try { host = new URL(node()).host; } catch { /* shown as empty */ }
  $("instDot").className = "dot " + (REACHABLE ? "ok" : "bad");
  $("instText").textContent = REACHABLE ? `instance reachable — ${host}` : `can't reach instance — ${host}`;

  const ids = Object.keys(jars);
  $("empty").hidden = ids.length > 0;
  $("jars").innerHTML = ids.map((id) => {
    const serverJars = PLUGINS.find((p) => p.id === id)?.jars || [];
    // #14: one pill per account the server holds for this plugin. When the server
    // lists none yet (never synced, or wallet not authed), fall back to the local
    // subscription state so the row still reports the last sync / error.
    const acct = serverJars.length
      ? serverJars.map((j) => { const [st, txt] = jarHealth(j); return `<span class="pill ${st}">${txt}</span>`; }).join("")
      : `<span class="pill ${health(jars[id])[0]}">${health(jars[id])[1]}</span>`;
    return `<div class="jar" data-plugin="${id}">` +
      `<div class="jhead"><span class="jname">${labelFor(id)}</span><button class="x" title="remove">✕</button></div>` +
      `<div class="jstat">${acct}</div></div>`;
  }).join("");

  const avail = PLUGINS.filter((p) => !ids.includes(p.id));
  $("addPlugin").innerHTML = avail.length
    ? avail.map((p) => `<option value="${p.id}">${p.label}</option>`).join("")
    : `<option value="">(no more sites)</option>`;
  $("addBtn").disabled = !avail.length;
}

$("jars").addEventListener("click", async (e) => {
  const row = e.target.closest(".jar"); if (!row) return;
  const id = row.dataset.plugin;
  if (e.target.classList.contains("x")) {
    await chrome.runtime.sendMessage({ action: "remove-jar", plugin: id });
    chrome.permissions.remove({ origins: originsFor(id) }); // best-effort cleanup
    return render();
  }
  row.classList.add("busy");
  try {
    const r = await call({ action: "sync-plugin", plugin: id });
    // #14: name the account the jar was stored under (from the sync response).
    if (!r.ok) status(r.error || "sync failed", false);
    else status(`${labelFor(id)}: account ${r.account ?? "default"} · ${r.count} cookies`, true);
  } catch (e) { status(String(e.message || e), false); }
  await loadPlugins(); // #14: re-fetch so the new account-qualified jar renders.
  await render();
});

$("addBtn").addEventListener("click", async () => {
  const id = $("addPlugin").value; if (!id) return;
  try {
    // permissions.request MUST be the first await — Chrome consumes the click
    // gesture on any prior await, then throws "may only be called during a user gesture".
    const origins = originsFor(id);
    if (origins.length && !(await chrome.permissions.request({ origins }))) {
      status(`host permission needed to read ${labelFor(id)} cookies`, false); return;
    }
    if (!(await ensureTrusted())) return;
    const r = await call({ action: "add-jar", plugin: id });
    // #14: surface the account the jar landed under, not just the cookie count.
    status(r.ok ? `${labelFor(id)}: account ${r.account ?? "default"} · ${r.error || `${r.count} cookies`}` : (r.error || "add failed"), r.ok && !r.error);
    await loadPlugins();
    await render();
  } catch (e) { status(String(e.message || e), false); }
});

$("syncAll").addEventListener("click", async () => {
  if (!(await ensureTrusted())) return;
  $("syncAll").disabled = true; $("syncAll").textContent = "Syncing…";
  try {
    const r = await call({ action: "sync-now" });
    if (!r.ok) status(r.error || "sync failed", false);
  } catch (e) { status(String(e.message || e), false); }
  $("syncAll").disabled = false; $("syncAll").textContent = "Sync all now";
  await loadPlugins(); // #14: re-fetch so account-qualified jars reflect the sync.
  await render();
});

const advCfg = () => ({
  serverUrl: $("serverUrl").value.replace(/\/$/, ""), secret: $("secret").value,
  daemon: $("daemon").value.replace(/\/$/, ""), project: $("project").value.trim(), allow: $("allow").value.trim(),
});
$("saveAdv").addEventListener("click", async () => { await chrome.storage.local.set(advCfg()); status("saved", true); await loadPlugins(); await render(); });
$("serverUrl").addEventListener("change", async () => { await chrome.storage.local.set(advCfg()); await loadPlugins(); await render(); });

(async () => {
  const cfg = await chrome.storage.local.get(["serverUrl", "secret", "daemon", "project", "allow", "walletSubject"]);
  $("serverUrl").value = cfg.serverUrl || DEFAULT_HOMESERVER;
  $("secret").value = cfg.secret || ""; $("daemon").value = cfg.daemon || "";
  $("project").value = cfg.project || ""; $("allow").value = cfg.allow || "";
  if (cfg.walletSubject) $("ident").textContent = `wallet identity: ${cfg.walletSubject}`;
  for (const id of ["secret", "daemon", "project", "allow"]) $(id).addEventListener("input", () => chrome.storage.local.set(advCfg()));
  await loadPlugins();
  await render();
})();

</script>
</body>
</html>
